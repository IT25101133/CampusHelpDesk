<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Knowledge base')}"></head>
<body>
<div class="app-shell" th:if="${currentUser != null}">
    <aside th:replace="~{fragments/layout :: sidebar('kb')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="page">
            <div th:replace="~{knowledgebase/_panel :: panel}"></div>
        </main>
    </div>
</div>
<div class="landing" th:if="${currentUser == null}">
    <nav class="landing-nav">
        <a class="brand" th:href="@{/}" style="color:inherit;">
            <span class="brand-mark">CH</span>
            <span class="brand-word">Campus Help Desk</span>
        </a>
        <a class="btn btn-primary" th:href="@{/login}">Sign in</a>
    </nav>
    <div th:replace="~{knowledgebase/_panel :: panel}"></div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
