<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reports')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('reports')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1>Operational reports</h1>
                    <p>Volume by status, priority, and category.</p>
                </div>
            </div>
            <div class="grid-2">
                <section class="card">
                    <h3>Status</h3>
                    <canvas id="statusChart" height="180"></canvas>
                </section>
                <section class="card">
                    <h3>Priority</h3>
                    <canvas id="priorityChart" height="180"></canvas>
                </section>
            </div>
            <section class="card" style="margin-top: 1rem;">
                <h3>Category load</h3>
                <table>
                    <tr th:each="entry : ${stats.byCategory}">
                        <td th:text="${entry.key}">IT</td>
                        <td th:text="${entry.value}">0</td>
                    </tr>
                </table>
            </section>
            <section class="card" style="margin-top: 1rem;">
                <h3>Recent audit log</h3>
                <div class="empty" th:if="${auditLogs.isEmpty()}">No audit events yet.</div>
                <table th:if="${!auditLogs.isEmpty()}">
                    <thead>
                    <tr>
                        <th>When</th>
                        <th>User</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="log : ${auditLogs}">
                        <td th:text="${#temporals.format(log.createdAt, 'dd MMM yyyy HH:mm')}">date</td>
                        <td th:text="${log.user != null} ? ${log.user.fullName} : 'System'">user</td>
                        <td>
                            <span th:text="${log.action}">action</span>
                            <span class="hint" th:if="${log.entityType != null}"
                                  th:text="' · ' + ${log.entityType} + ' #' + ${log.entityId}">TICKET</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    const statusLabels = /*[[${stats.byStatus.keySet()}]]*/ [];
    const statusValues = /*[[${stats.byStatus.values()}]]*/ [];
    const priorityLabels = /*[[${stats.byPriority.keySet()}]]*/ [];
    const priorityValues = /*[[${stats.byPriority.values()}]]*/ [];
    const colors = ["#1f5c45", "#b0893e", "#2c5282", "#9b2c2c", "#6b6258"];
    new Chart(document.getElementById("statusChart"), {
        type: "doughnut",
        data: { labels: statusLabels, datasets: [{ data: statusValues, backgroundColor: colors }] }
    });
    new Chart(document.getElementById("priorityChart"), {
        type: "bar",
        data: { labels: priorityLabels, datasets: [{ data: priorityValues, backgroundColor: "#1f5c45" }] },
        options: { plugins: { legend: { display: false } } }
    });
</script>
</body>
</html>
