# Optional MySQL profile: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# 1. Run src/main/resources/db/mysql-schema.sql in MySQL Workbench
# 2. Set APP_DB_USER / APP_DB_PASSWORD (or edit below)
# 3. First boot can keep sql.init.mode=always so seed.sql loads

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_helpdesk?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${APP_DB_USER:root}
    password: ${APP_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  h2:
    console:
      enabled: false
