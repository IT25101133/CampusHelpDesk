spring:
  application:
    name: campus-helpdesk

  datasource:
    url: "jdbc:sqlserver://localhost:1433;databaseName=campus_helpdesk;encrypt=true;trustServerCertificate=true"
    username: ${APP_DB_USER:sa}
    password: "${APP_DB_PASSWORD:Shenon@0424}"
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    database: sql_server
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    open-in-view: true

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081

app:
  name: Campus Help Desk
  group: SE2030 Group 11
  assignment:
    strategy: ${ASSIGNMENT_STRATEGY:category-based}
  uploads:
    dir: src/main/resources/static/uploads
    max-file-size-mb: ${MAX_TICKET_ATTACHMENT_MB:5}
  jwt:
    secret: ${JWT_SECRET:CampusHelpDeskSecretKeyForHS256TokensMustBe32B!}
    expiration-ms: 86400000
