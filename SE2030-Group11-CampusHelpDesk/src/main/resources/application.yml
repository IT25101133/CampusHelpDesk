spring:
  application:
    name: campus-helpdesk

  datasource:
    url: jdbc:mysql://localhost:3306/campus_helpdesk
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: true

  thymeleaf:
    cache: false

server:
  port: 8080

app:
  name: Campus Help Desk
  group: SE2030 Group 11
  jwt:
    secret: ${JWT_SECRET:CampusHelpDeskSecretKeyForHS256TokensMustBe32B!}
    expiration-ms: 86400000
