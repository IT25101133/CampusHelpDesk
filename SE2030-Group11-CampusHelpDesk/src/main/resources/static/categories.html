<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Departments · SLIIT Services Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/pro.css"/>
    <script>
        (function () {
            try {
                var session = JSON.parse(localStorage.getItem("chd.session") || "null");
                if (!session || !session.token) {
                    location.replace("/welcome");
                } else if (session.role !== "ADMIN") {
                    location.replace("/workspace");
                }
            } catch (e) {
                location.replace("/welcome");
            }
        })();
    </script>
</head>
<body data-page="departments">
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <a class="brand" href="/workspace">
            <img src="/images/logo.svg" alt="Campus Help Desk" class="brand-logo" width="40" height="40" style="border-radius:10px;"/>
            <span>
                <span class="brand-name">Campus Help Desk</span>
                <span class="brand-caption">SE2030 · GROUP 11</span>
            </span>
        </a>
        <div class="user-widget">
            <div class="avatar" data-user-initials></div>
            <div>
                <div class="user-name" data-user-name></div>
                <div class="user-role" data-user-role></div>
            </div>
        </div>
        <nav class="sidebar-nav"></nav>
        <button class="sign-out" type="button" data-sign-out>Sign out</button>
    </aside>
    <div class="workspace">
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation">☰</button>
            <div class="topbar-copy">
                <h1 class="page-title">Issue categories</h1>
                <p class="page-sub">Departments, SLA hours, and automatic ticket routing</p>
            </div>
            <div class="avatar lg" data-user-initials></div>
        </header>
        <main class="page-content">
            <div class="split-layout">
                <section class="card">
                    <div class="panel-head">
                        <div>
                            <h3 id="category-form-title">Add a category</h3>
                            <p>New tickets in this category are routed to matching staff.</p>
                        </div>
                    </div>
                    <form id="category-form" class="pad-form" novalidate>
                        <input type="hidden" id="category-id"/>
                        <div class="form-banner" id="category-banner" role="status"></div>
                        <div class="field">
                            <label for="category-name">Category name</label>
                            <select id="category-name" required>
                                <option value="">Select a category</option>
                                <option>IT Support</option>
                                <option>Academic</option>
                                <option>Library Services</option>
                                <option>Finance Office</option>
                                <option>Hostel</option>
                                <option>Facilities</option>
                                <option>Examinations</option>
                                <option>General</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="category-department">Support department</label>
                            <input id="category-department" type="text" required maxlength="100" placeholder="IT Services"/>
                        </div>
                        <div class="field">
                            <label for="category-sla">SLA hours</label>
                            <input id="category-sla" type="number" min="1" max="720" value="48" required/>
                        </div>
                        <div class="ticket-actions">
                            <button class="btn btn-primary" type="submit">Save category</button>
                            <button class="btn btn-ghost" type="button" id="category-cancel" hidden>Cancel edit</button>
                        </div>
                    </form>
                </section>
                <section class="card">
                    <div class="panel-head"><div><h3>Active categories</h3><p>Used for routing, priority SLA, and ledger filters</p></div></div>
                    <div class="table-wrap">
                        <table class="ticket-table compact">
                            <thead><tr><th>CATEGORY</th><th>DEPARTMENT</th><th>SLA</th><th></th></tr></thead>
                            <tbody id="category-rows"><tr><td colspan="4">Loading…</td></tr></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/pro.js"></script>
</body>
</html>
