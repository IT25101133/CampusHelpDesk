<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Submit Support Request · SLIIT Services Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/pro.css"/>
    <script>
        (function () {
            try {
                var session = JSON.parse(localStorage.getItem("chd.session") || "null");
                if (!session || !session.token) {
                    location.replace("/welcome");
                }
            } catch (e) {
                location.replace("/welcome");
            }
        })();
    </script>
</head>
<body data-page="submit">
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <a class="brand" href="/workspace">
            <img src="/images/logo.svg" alt="Campus Help Desk" class="brand-logo" width="40" height="40" style="border-radius:10px;"/>
            <span>
                <span class="brand-name">Campus Help Desk</span>
                <span class="brand-caption">SE2030 · GROUP 11</span>
            </span>
        </a>
        <div class="user-widget">
            <div class="avatar" data-user-initials></div>
            <div>
                <div class="user-name" data-user-name></div>
                <div class="user-role" data-user-role></div>
            </div>
        </div>
        <nav class="sidebar-nav"></nav>
        <button class="sign-out" type="button" data-sign-out>Sign out</button>
    </aside>
    <div class="workspace">
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation">☰</button>
            <div class="topbar-copy">
                <h1 class="page-title">Submit Support Request</h1>
                <p class="page-sub">Describe your issue for automated department routing</p>
            </div>
            <div class="topbar-search">
                <input class="search-input" type="search" placeholder="🔍 Search tickets &amp; knowledge..."/>
            </div>
            <div class="avatar lg" data-user-initials></div>
        </header>
        <main class="page-content">
            <div class="submit-wrap">
                <form class="submit-card" id="ticket-form">
                    <div class="submit-head">
                        <h3>Create Support Ticket</h3>
                        <span class="submit-hint">Instant routing to faculty departments</span>
                    </div>
                    <div class="form-banner" id="form-banner" role="status"></div>
                    <div class="field">
                        <label for="subject">Issue Subject / Title</label>
                        <input id="subject" name="subject" type="text" required maxlength="200" placeholder="e.g., Moodle module access error or hostel water supply issue"/>
                    </div>
                    <div class="form-grid-2">
                        <div class="field">
                            <label for="category">Department Category</label>
                            <select id="category" name="category" required>
                                <option value="">Select a department</option>
                            </select>
                            <p class="field-error" id="category-error" hidden>Please select a department</p>
                        </div>
                        <div class="priority-group">
                            <label>Priority Level</label>
                            <input type="hidden" id="priority-value" name="priority" value="high"/>
                            <div class="priority-toggles">
                                <button class="priority-btn" type="button" data-level="low">Low</button>
                                <button class="priority-btn" type="button" data-level="med">Med</button>
                                <button class="priority-btn selected" type="button" data-level="high">High</button>
                                <button class="priority-btn" type="button" data-level="crit">Crit</button>
                            </div>
                        </div>
                    </div>
                    <div class="field">
                        <label for="description">Detailed Description &amp; Error Logs</label>
                        <textarea id="description" name="description" required maxlength="4000" placeholder="Describe error codes encountered, exact location, or steps to reproduce..."></textarea>
                    </div>
                    <div class="kb-suggest" id="kb-suggestions" hidden></div>
                    <div class="field">
                        <label>Supporting Attachments (Optional — max 5 MB per file)</label>
                        <input class="sr-only" id="attachments" name="attachments" type="file" multiple/>
                        <div class="dropzone" id="dropzone" role="button" tabindex="0">
                            <span data-drop-label>📎 Drag &amp; drop screenshots or documents here, or browse files</span>
                        </div>
                        <p class="field-error" id="attachment-error" hidden style="color: var(--accent-rose, #ef4444); font-size: 0.85rem; margin-top: 0.4rem; font-weight: 500;"></p>
                    </div>
                    <button class="btn btn-primary btn-block" type="submit">Submit Request →</button>
                </form>
            </div>
        </main>
    </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/pro.js"></script>
</body>
</html>
