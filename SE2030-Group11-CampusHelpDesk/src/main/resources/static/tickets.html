<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Support Ticket Ledger · SLIIT Services Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/pro.css"/>
    <script>
        (function () {
            try {
                var session = JSON.parse(localStorage.getItem("chd.session") || "null");
                if (!session || !session.token) {
                    location.replace("/welcome");
                }
            } catch (e) {
                location.replace("/welcome");
            }
        })();
    </script>
</head>
<body data-page="tickets">
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <a class="brand" href="/workspace">
            <img src="/images/logo.svg" alt="Campus Help Desk" class="brand-logo" width="40" height="40" style="border-radius:10px;"/>
            <span>
                <span class="brand-name">Campus Help Desk</span>
                <span class="brand-caption">SE2030 · GROUP 11</span>
            </span>
        </a>
        <div class="user-widget">
            <div class="avatar" data-user-initials></div>
            <div>
                <div class="user-name" data-user-name></div>
                <div class="user-role" data-user-role></div>
            </div>
        </div>
        <nav class="sidebar-nav"></nav>
        <button class="sign-out" type="button" data-sign-out>Sign out</button>
    </aside>
    <div class="workspace">
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation">☰</button>
            <div class="topbar-copy">
                <h1 class="page-title">Support Ticket Ledger</h1>
                <p class="page-sub">Track and manage all campus requests</p>
            </div>
            <div class="topbar-search">
                <input class="search-input" type="search" placeholder="🔍 Search tickets &amp; knowledge..."/>
            </div>
            <div class="avatar lg" data-user-initials></div>
        </header>
        <main class="page-content">
            <div class="filter-row">
                <button class="pill-tab active" type="button" data-filter="all">All (<span id="count-all">0</span>)</button>
                <button class="pill-tab" type="button" data-filter="open">Open (<span id="count-open">0</span>)</button>
                <button class="pill-tab" type="button" data-filter="progress">In Progress (<span id="count-progress">0</span>)</button>
                <button class="pill-tab" type="button" data-filter="resolved">Resolved (<span id="count-resolved">0</span>)</button>
                <a class="btn btn-primary" href="/request">+ New Ticket</a>
            </div>
            <div class="filter-tools">
                <input id="ticket-search" class="search-input" type="search" placeholder="Search ticket ID, subject, or assignee"/>
                <select id="ticket-category-filter">
                    <option value="">All departments</option>
                </select>
            </div>
            <div class="table-wrap">
                <table class="ticket-table">
                    <thead>
                    <tr>
                        <th>TICKET ID</th>
                        <th>SUBJECT &amp; ASSIGNEE</th>
                        <th>SUBMITTER</th>
                        <th>CATEGORY / DEPT</th>
                        <th>PRIORITY</th>
                        <th>STATUS</th>
                        <th>UPDATED</th>
                    </tr>
                    </thead>
                    <tbody id="ticket-rows">
                    <tr><td colspan="7">Loading tickets…</td></tr>
                    </tbody>
                </table>
            </div>
            <section class="card ticket-detail" id="ticket-detail" hidden></section>
        </main>
    </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/pro.js"></script>
</body>
</html>
