<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="auth-page">
<section class="auth-hero">
    <div>
        <p class="hero-kicker">SE2030 Group 11</p>
        <h1>Campus Help Desk</h1>
        <p>IT labs, facilities, academic records, and finance — tracked in one place.</p>
    </div>
    <p>Faculty of Computing · SLIIT</p>
</section>
<section class="auth-panel">
    <div class="auth-card">
        <h2>Sign in</h2>
        <p class="hint">Use your campus email.</p>
        <div class="flash flash-ok" th:if="${param.logout}">You have been signed out.</div>
        <div class="flash flash-err" th:if="${param.error}">Email or password is incorrect.</div>
        <div class="flash flash-ok" th:if="${success}" th:text="${success}"></div>
        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required autofocus/>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required/>
            </div>
            <button class="btn btn-primary" type="submit">Continue</button>
        </form>
        <p>New here? <a th:href="@{/register}">Create an account</a></p>
    </div>
</section>
</body>
</html>
