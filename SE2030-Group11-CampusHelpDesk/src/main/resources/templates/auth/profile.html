<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('profile')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1>Profile</h1>
                    <p>Authentication &amp; Profile module — Nirasha</p>
                </div>
            </div>
            <div class="flash flash-ok" th:if="${success}" th:text="${success}" data-auto-dismiss="true"></div>
            <div class="flash flash-err" th:if="${error}" th:text="${error}"></div>
            <div class="form-card" style="max-width: 560px;">
                <p><strong th:text="${user.email}">email</strong> · <span th:text="${user.role}">ROLE</span></p>
                <form th:action="@{/profile}" th:object="${profileForm}" method="post">
                    <div class="field">
                        <label>Full name</label>
                        <input th:field="*{fullName}" required maxlength="100"/>
                        <p class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                    </div>
                    <div class="field">
                        <label>Department</label>
                        <input th:field="*{department}" maxlength="100"/>
                        <p class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></p>
                    </div>
                    <div class="field">
                        <label>Student ID</label>
                        <input th:field="*{studentId}" maxlength="20"/>
                        <p class="error" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></p>
                    </div>
                    <div class="field">
                        <label>New password</label>
                        <input type="password" th:field="*{newPassword}" minlength="8" maxlength="72"/>
                        <p class="hint">Leave blank to keep the current password.</p>
                        <p class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
                    </div>
                    <button class="btn btn-primary" type="submit">Save profile</button>
                </form>
                <form th:action="@{/profile/deactivate}" method="post" style="margin-top: 1rem;"
                      th:if="${user.role.name() != 'ADMIN'}"
                      onsubmit="return confirm('Deactivate your account? You will be signed out.');">
                    <button class="btn btn-ghost" type="submit">Deactivate account</button>
                </form>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
