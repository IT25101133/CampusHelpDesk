<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="auth-page">
<section class="auth-hero">
    <div>
        <p class="hero-kicker">Student access</p>
        <h1>Create your help desk account</h1>
        <p>Staff and admin accounts are provisioned by IT Services.</p>
    </div>
    <p>Use your @sliit.lk email when possible.</p>
</section>
<section class="auth-panel">
    <div class="auth-card">
        <h2>Register</h2>
        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <div class="field">
                <label>Full name</label>
                <input th:field="*{fullName}"/>
                <p class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" th:field="*{email}"/>
                <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" th:field="*{password}"/>
                <p class="hint">At least 8 characters.</p>
                <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>
            <div class="field">
                <label>Student ID</label>
                <input th:field="*{studentId}"/>
            </div>
            <div class="field">
                <label>Department / faculty</label>
                <input th:field="*{department}"/>
            </div>
            <button class="btn btn-primary" type="submit">Create account</button>
        </form>
        <p>Already registered? <a th:href="@{/login}">Sign in</a></p>
    </div>
</section>
</body>
</html>
