<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${userId == null} ? 'New user' : 'Edit user')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('users')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1 th:text="${userId == null} ? 'New user' : 'Edit user'">User</h1>
                    <p>Authentication &amp; Profile — Nirasha</p>
                </div>
            </div>
            <div class="form-card" style="max-width: 560px;">
                <form th:action="${userId == null} ? @{/users} : @{/users/{id}(id=${userId})}"
                      th:object="${userForm}" method="post">
                    <div class="field">
                        <label>Full name</label>
                        <input th:field="*{fullName}" required maxlength="100"/>
                        <p class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                    </div>
                    <div class="field">
                        <label>Email</label>
                        <input th:field="*{email}" type="email" required maxlength="150"/>
                        <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    </div>
                    <div class="field">
                        <label>Password</label>
                        <input type="password" th:field="*{password}" minlength="8" maxlength="72"/>
                        <p class="hint" th:if="${userId != null}">Leave blank to keep the current password.</p>
                    </div>
                    <div class="field">
                        <label>Role</label>
                        <select th:field="*{role}">
                            <option th:each="role : ${roles}" th:value="${role}" th:text="${role}">STUDENT</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Department</label>
                        <input th:field="*{department}" maxlength="100"/>
                    </div>
                    <div class="field">
                        <label>Student ID</label>
                        <input th:field="*{studentId}" maxlength="20"/>
                    </div>
                    <button class="btn btn-primary" type="submit">Save user</button>
                    <a class="btn btn-ghost" th:href="@{/users}">Cancel</a>
                </form>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
