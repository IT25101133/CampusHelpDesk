<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Users')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('users')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1>Users</h1>
                    <p>Authentication &amp; Profile — Nirasha</p>
                </div>
                <a class="btn btn-primary" th:href="@{/users/new}">New user</a>
            </div>
            <div class="flash flash-ok" th:if="${success}" th:text="${success}" data-auto-dismiss="true"></div>
            <div class="flash flash-err" th:if="${error}" th:text="${error}"></div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Department</th>
                        <th>Active</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="account : ${users}">
                        <td th:text="${account.fullName}">Name</td>
                        <td th:text="${account.email}">email</td>
                        <td th:text="${account.role}">ROLE</td>
                        <td th:text="${account.department != null} ? ${account.department} : '—'">Dept</td>
                        <td th:text="${account.enabled} ? 'Yes' : 'No'">Yes</td>
                        <td>
                            <a th:href="@{/users/{id}/edit(id=${account.id})}">Edit</a>
                            <span class="hint" th:if="${account.role.name() == 'ADMIN'}">Admin accounts cannot be deactivated</span>
                            <form th:if="${account.role.name() != 'ADMIN'}" th:action="@{/users/{id}/delete(id=${account.id})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Deactivate this account?');">
                                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <label class="hint"><input type="checkbox" name="permanent" value="true"/> Permanently delete this account and all of its data</label>
                                <button class="btn btn-ghost btn-small" type="submit">Deactivate</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
