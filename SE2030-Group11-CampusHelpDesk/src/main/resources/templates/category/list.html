<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Categories')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('categories')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1>Categories</h1>
                    <p>Categorization &amp; Assignment — Umer</p>
                </div>
                <a class="btn btn-primary" th:href="@{/categories/new}" sec:authorize="hasAnyRole('ADMIN','DEPT_HEAD')">New category</a>
            </div>
            <div class="flash flash-ok" th:if="${success}" th:text="${success}" data-auto-dismiss="true"></div>
            <div class="flash flash-err" th:if="${error}" th:text="${error}"></div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Department</th>
                        <th>SLA</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cat : ${categories}">
                        <td>
                            <strong th:text="${cat.name}">IT</strong>
                        </td>
                        <td th:text="${cat.department != null} ? ${cat.department} : '—'">IT Services</td>
                        <td th:text="${cat.slaHours + 'h'}">24h</td>
                        <td>
                            <a th:href="@{/categories/{id}/edit(id=${cat.id})}" sec:authorize="hasAnyRole('ADMIN','DEPT_HEAD')">Edit</a>
                            <form th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post" style="display:inline"
                                  sec:authorize="hasAnyRole('ADMIN','DEPT_HEAD')"
                                  onsubmit="return confirm('Delete this category?');">
                                <button class="btn btn-ghost btn-small" type="submit">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
