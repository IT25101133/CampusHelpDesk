<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' · Campus Help Desk'">Campus Help Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<aside class="sidebar" th:fragment="sidebar(active)">
    <a class="brand" th:href="@{/dashboard}">
        <img th:src="@{/images/logo.svg}" src="/images/logo.svg" alt="Campus Help Desk" class="brand-logo" width="36" height="36" style="border-radius: 10px;"/>
        <span>
            <span class="brand-word">Campus Help Desk</span>
            <span class="brand-sub">SE2030 · Group 11</span>
        </span>
    </a>
    <nav>
        <div class="nav-group">
            <div class="nav-label">Workspace</div>
            <a class="nav-link" th:classappend="${active == 'dashboard'} ? ' active'" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link" th:classappend="${active == 'tickets'} ? ' active'" th:href="@{/tickets}">Tickets</a>
            <a class="nav-link" th:href="@{/tickets/new}">New ticket</a>
            <a class="nav-link" th:classappend="${active == 'kb'} ? ' active'" th:href="@{/knowledgebase}">Knowledge base</a>
            <a class="nav-link" th:classappend="${active == 'notifications'} ? ' active'" th:href="@{/notifications}">
                Notifications
                <span class="badge" th:if="${unreadCount > 0}" th:text="${unreadCount}">0</span>
            </a>
        </div>
        <div class="nav-group" sec:authorize="hasAnyRole('STAFF','ADMIN','LECTURER','DEPT_HEAD')">
            <div class="nav-label">Operations</div>
            <a class="nav-link" th:classappend="${active == 'categories'} ? ' active'" th:href="@{/categories}">Categories</a>
            <a class="nav-link" th:classappend="${active == 'users'} ? ' active'" th:href="@{/users}"
               sec:authorize="hasRole('ADMIN')">Users</a>
            <a class="nav-link" th:classappend="${active == 'reports'} ? ' active'" th:href="@{/reports}">Reports</a>
            <a class="nav-link" th:href="@{/reports/saved}" sec:authorize="hasRole('ADMIN')">Saved reports</a>
        </div>
    </nav>
</aside>
<header class="topbar" th:fragment="topbar">
    <div>
        <strong th:if="${currentUser != null}" th:text="'Welcome, ' + ${currentUser.fullName}">Welcome</strong>
    </div>
    <div class="who" th:if="${currentUser != null}">
        <div>
            <strong th:text="${currentUser.fullName}">Name</strong>
            <small th:text="${currentUser.role}">ROLE</small>
        </div>
        <a class="avatar" th:href="@{/profile}" th:text="${currentUser.initials}">NP</a>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-ghost btn-small" type="submit">Sign out</button>
        </form>
    </div>
</header>
</html>
