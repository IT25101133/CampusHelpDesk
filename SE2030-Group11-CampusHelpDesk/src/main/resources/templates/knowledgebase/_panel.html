<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div class="kb-panel" th:fragment="panel">
    <div class="page-head">
        <div>
            <h1>Knowledge base</h1>
            <p>Knowledge Base — Weerasekara</p>
        </div>
    </div>
    <form class="form-card" method="get" th:action="@{/knowledgebase}" style="margin-bottom: 1.2rem;">
        <div class="field">
            <label>Search articles</label>
            <input name="q" th:value="${q}" placeholder="password, projector, receipt…"/>
        </div>
        <button class="btn btn-primary" type="submit">Search</button>
    </form>
    <div class="grid-2">
        <section>
            <article class="card" style="margin-bottom: 1rem;" th:each="article : ${articles}">
                <h3><a th:href="@{/knowledgebase/{id}(id=${article.id})}" th:text="${article.title}">Title</a></h3>
                <p class="hint" th:text="${article.category != null} ? ${article.category.name} : 'General'">IT</p>
                <p th:text="${#strings.abbreviate(article.content, 180)}">excerpt</p>
            </article>
            <div class="card empty" th:if="${articles.isEmpty()}">No articles match that search.</div>
        </section>
        <section class="card faq">
            <h3>Categories</h3>
            <p th:each="cat : ${kbCategories}" th:text="${cat.name}">Accounts</p>
            <p class="hint" th:if="${kbCategories.isEmpty()}">No categories yet.</p>
        </section>
    </div>
</div>
</body>
</html>
