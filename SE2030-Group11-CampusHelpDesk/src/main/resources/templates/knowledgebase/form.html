<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${articleId == null} ? 'New article' : 'Edit article')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('kb')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1 th:text="${articleId == null} ? 'New article' : 'Edit article'">Article</h1>
                    <p>Knowledge Base — Weerasekara</p>
                </div>
            </div>
            <div class="form-card" style="max-width: 720px;">
                <form th:action="${articleId == null} ? @{/knowledgebase} : @{/knowledgebase/{id}(id=${articleId})}"
                      th:object="${articleForm}" method="post">
                    <div class="field">
                        <label>Title</label>
                        <input th:field="*{title}" required maxlength="200"/>
                        <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
                    </div>
                    <div class="field">
                        <label>Category</label>
                        <select th:field="*{categoryId}">
                            <option value="">General</option>
                            <option th:each="cat : ${kbCategories}" th:value="${cat.id}" th:text="${cat.name}">IT</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Content</label>
                        <textarea th:field="*{content}" rows="10" required maxlength="20000"></textarea>
                        <p class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
                    </div>
                    <button class="btn btn-primary" type="submit">Save article</button>
                    <a class="btn btn-ghost" th:href="@{/knowledgebase}">Cancel</a>
                </form>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
