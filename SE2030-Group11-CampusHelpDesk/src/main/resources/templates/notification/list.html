<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('notifications')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1>Notifications</h1>
                    <p>Communication &amp; Notifications — Arachchi</p>
                </div>
                <form th:action="@{/notifications/read-all}" method="post">
                    <button class="btn btn-ghost" type="submit">Mark all read</button>
                </form>
            </div>
            <div class="flash flash-ok" th:if="${success}" th:text="${success}" data-auto-dismiss="true"></div>
            <div class="card empty" th:if="${notifications.isEmpty()}">No notifications yet.</div>
            <div class="card" th:each="item : ${notifications}" th:style="${!item.read} ? 'border-left: 4px solid #b0893e;'">
                <form th:action="@{/notifications/{id}/read(id=${item.id})}" method="post">
                    <button class="btn btn-ghost" type="submit" style="width:100%; text-align:left;">
                        <strong th:text="${item.message}">Message</strong>
                        <small th:text="${#temporals.format(item.createdAt, 'dd MMM yyyy HH:mm')}">date</small>
                    </button>
                </form>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
