<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1>Dashboard</h1>
                    <p>Reporting &amp; Dashboard — Jayathilaka</p>
                </div>
            </div>
            <div class="grid-4">
                <div class="stat"><span>Total</span><strong th:text="${stats.totalTickets}">0</strong></div>
                <div class="stat"><span>Open</span><strong th:text="${stats.openTickets}">0</strong></div>
                <div class="stat"><span>In progress</span><strong th:text="${stats.inProgressTickets}">0</strong></div>
                <div class="stat"><span>Resolved</span><strong th:text="${stats.resolvedTickets}">0</strong></div>
            </div>
            <div class="grid-2" style="margin-top: 1.2rem;">
                <section class="card">
                    <h3>Recent tickets</h3>
                    <table>
                        <tr th:each="ticket : ${recentTickets}">
                            <td><a th:href="@{/tickets/{id}(id=${ticket.id})}" th:text="${ticket.ticketNumber}">HD</a></td>
                            <td th:text="${ticket.title}">title</td>
                            <td><span class="pill" th:classappend="${ticket.status}" th:text="${#strings.replace(ticket.status, '_', ' ')}">OPEN</span></td>
                        </tr>
                    </table>
                    <div class="empty" th:if="${recentTickets.isEmpty()}">No tickets to show.</div>
                </section>
                <section class="card">
                    <h3>By category</h3>
                    <p th:each="entry : ${stats.byCategory}">
                        <strong th:text="${entry.value}">0</strong>
                        <span th:text="${entry.key}">IT</span>
                    </p>
                    <p><a th:href="@{/reports}">Open full reports</a></p>
                </section>
            </div>
        </main>
    </div>
</div>
</body>
</html>
