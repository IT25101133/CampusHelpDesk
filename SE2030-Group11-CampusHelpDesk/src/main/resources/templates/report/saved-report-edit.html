<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit report')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('reports')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1>Update report</h1>
                    <p>Created by and created at stay unchanged. This save writes updated by and updated at.</p>
                </div>
                <a class="btn btn-ghost" th:href="@{/reports/saved/{id}(id=${report.id})}">Back</a>
            </div>
            <div class="flash flash-err" th:if="${error}" th:text="${error}"></div>
            <section class="card">
                <form th:action="@{/reports/saved/{id}(id=${report.id})}" th:object="${reportForm}" method="post">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="field">
                        <label for="name">Report name</label>
                        <input id="name" th:field="*{name}" required maxlength="150"/>
                        <p class="hint" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name is required</p>
                    </div>
                    <div class="field">
                        <label for="department">Department</label>
                        <select id="department" th:field="*{department}">
                            <option value="">Any department</option>
                            <option th:each="dept : ${departments}" th:value="${dept}" th:text="${dept}">IT</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="status">Status</label>
                        <select id="status" th:field="*{status}">
                            <option value="">Any status</option>
                            <option th:each="option : ${statuses}" th:value="${option}"
                                    th:text="${#strings.replace(option.name(), '_', ' ')}">OPEN</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="priority">Priority</label>
                        <select id="priority" th:field="*{priority}">
                            <option value="">Any priority</option>
                            <option th:each="option : ${priorities}" th:value="${option}" th:text="${option}">LOW</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" type="submit">Save report</button>
                </form>
            </section>
        </main>
    </div>
</div>
</body>
</html>
