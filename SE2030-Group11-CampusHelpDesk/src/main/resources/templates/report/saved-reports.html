<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Saved reports')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('reports')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1>Saved reports</h1>
                    <p>Reporting &amp; Dashboard — Jayathilaka</p>
                </div>
                <a class="btn btn-ghost" th:href="@{/reports}">Operational reports</a>
            </div>
            <div class="flash flash-ok" th:if="${success}" th:text="${success}" data-auto-dismiss="true"></div>
            <div class="flash flash-err" th:if="${error}" th:text="${error}"></div>

            <section class="card">
                <h3>Generate a report</h3>
                <form th:action="@{/reports/saved/generate}" method="post">
                    <div class="field">
                        <label for="name">Report name</label>
                        <input id="name" name="name" required maxlength="150"
                               placeholder="Resolved tickets — September"/>
                    </div>
                    <div class="field">
                        <label for="department">Department</label>
                        <select id="department" name="department">
                            <option value="">Any department</option>
                            <option th:each="dept : ${departments}" th:value="${dept}" th:text="${dept}">IT</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="">Any status</option>
                            <option th:each="option : ${statuses}" th:value="${option}"
                                    th:text="${#strings.replace(option, '_', ' ')}">OPEN
                            </option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option value="">Any priority</option>
                            <option th:each="option : ${priorities}" th:value="${option}" th:text="${option}">LOW
                            </option>
                        </select>
                    </div>
                    <button class="btn btn-primary" type="submit">Generate report</button>
                </form>
            </section>

            <section class="card" style="margin-top: 1rem;">
                <h3>Report history</h3>
                <div class="empty" th:if="${reports.isEmpty()}">No reports saved yet.</div>
                <div class="table-wrap" th:if="${!reports.isEmpty()}">
                    <table>
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Filters</th>
                            <th>Tickets</th>
                            <th>Avg resolution</th>
                            <th>Generated</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="report : ${reports}">
                            <td>
                                <a th:href="@{/reports/saved/{id}(id=${report.id})}" th:text="${report.name}">Report</a>
                            </td>
                            <td>
                                <span class="hint" th:text="${report.departmentLabel} + ' · ' + ${report.statusLabel}
                                    + ' · ' + ${report.priorityLabel}">All</span>
                            </td>
                            <td th:text="${report.ticketCount}">0</td>
                            <td th:text="${report.avgResolutionHours != null}
                                ? ${report.avgResolutionHours} + ' h' : '—'">—</td>
                            <td th:text="${#temporals.format(report.createdAt, 'dd MMM yyyy HH:mm')}">date</td>
                            <td>
                                <a class="btn btn-ghost btn-small"
                                   th:if="${#authorization.expression('hasRole(''ADMIN'')') or (report.createdBy != null and #authentication.name == report.createdBy.email)}"
                                   th:href="@{/admin/reports/{id}/edit(id=${report.id})}">Update</a>
                                <form th:if="${#authorization.expression('hasRole(''ADMIN'')') or (report.createdBy != null and #authentication.name == report.createdBy.email)}"
                                      th:action="@{/admin/reports/{id}/delete(id=${report.id})}" method="post"
                                      onsubmit="return confirm('Delete this report?');" style="display:inline">
                                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button class="btn btn-ghost btn-small" type="submit">Delete</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
