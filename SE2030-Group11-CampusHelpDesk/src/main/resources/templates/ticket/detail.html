<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ticket')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('tickets')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <p class="hero-kicker" th:text="${ticket.ticketNumber}">HD-1</p>
                    <h1 th:text="${ticket.title}">Title</h1>
                    <p>
                        <span class="pill" th:classappend="${ticket.status}" th:text="${#strings.replace(ticket.status, '_', ' ')}">OPEN</span>
                        <span class="pill" th:classappend="${ticket.priority}" th:text="${ticket.priority}">MED</span>
                    </p>
                </div>
            </div>
            <div class="flash flash-ok" th:if="${success}" th:text="${success}" data-auto-dismiss="true"></div>
            <div class="flash flash-err" th:if="${error}" th:text="${error}"></div>
            <div class="grid-2">
                <section class="card">
                    <p th:text="${ticket.description}">body</p>
                    <p class="hint">
                        Opened by <span th:text="${ticket.requester.fullName}">user</span>
                        on <span th:text="${#temporals.format(ticket.createdAt, 'dd MMM yyyy HH:mm')}">date</span>
                    </p>
                    <h3>Conversation</h3>
                    <div class="empty" th:if="${comments.isEmpty()}">No replies yet.</div>
                    <div class="comment" th:each="comment : ${comments}">
                        <strong th:text="${comment.author.fullName}">Author</strong>
                        <small th:text="${#temporals.format(comment.createdAt, 'dd MMM HH:mm')}">time</small>
                        <p th:text="${comment.body}">text</p>
                    </div>
                    <form th:action="@{/tickets/{id}/comments(id=${ticket.id})}" method="post">
                        <div class="field">
                            <label>Reply</label>
                            <textarea name="body" required></textarea>
                        </div>
                        <button class="btn btn-primary" type="submit">Post reply</button>
                    </form>
                </section>
                <aside>
                    <div class="card">
                        <p><strong>Category</strong><br/><span th:text="${ticket.category.name}">IT</span></p>
                        <p><strong>SLA</strong><br/><span th:text="${ticket.category.slaHours + ' hours'}">48</span></p>
                        <p><strong>Assignee</strong><br/>
                            <span th:text="${ticket.assignee != null} ? ${ticket.assignee.fullName} : 'Unassigned'">Staff</span>
                        </p>
                    </div>
                    <div class="card" style="margin-top: 1rem;" th:if="${canManage}">
                        <h3>Staff actions</h3>
                        <form th:action="@{/tickets/{id}/status(id=${ticket.id})}" method="post">
                            <div class="field">
                                <label>Status</label>
                                <select name="status">
                                    <option th:each="s : ${statuses}" th:value="${s}" th:selected="${s == ticket.status}"
                                            th:text="${#strings.replace(s, '_', ' ')}">OPEN</option>
                                </select>
                            </div>
                            <button class="btn btn-primary btn-small" type="submit">Update status</button>
                        </form>
                        <form th:action="@{/tickets/{id}/assign(id=${ticket.id})}" method="post">
                            <div class="field">
                                <label>Reassign</label>
                                <select name="assigneeId">
                                    <option th:each="staff : ${staffMembers}" th:value="${staff.id}"
                                            th:selected="${ticket.assignee != null and ticket.assignee.id == staff.id}"
                                            th:text="${staff.fullName}">Staff</option>
                                </select>
                            </div>
                            <button class="btn btn-ghost btn-small" type="submit">Assign</button>
                        </form>
                    </div>
                </aside>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
