<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New ticket')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('tickets')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="page">
            <div class="page-head">
                <div>
                    <h1>Submit a ticket</h1>
                    <p>Describe the issue clearly so the right team can pick it up.</p>
                </div>
            </div>
            <div class="form-card" style="max-width: 720px;">
                <form th:action="@{/tickets}" th:object="${ticketForm}" method="post">
                    <div class="field">
                        <label>Title</label>
                        <input th:field="*{title}" required maxlength="200" placeholder="e.g. LMS login fails after password reset"/>
                        <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
                    </div>
                    <div class="field">
                        <label>Department / category</label>
                        <select th:field="*{categoryId}" required>
                            <option value="">Select a department</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}"
                                    th:text="${cat.name + (cat.department != null and !cat.department.isEmpty() ? ' — ' + cat.department : '')}">IT</option>
                        </select>
                        <p class="error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">Please select a department</p>
                    </div>
                    <div class="field">
                        <label>Priority</label>
                        <select th:field="*{priority}" required>
                            <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}">MEDIUM</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Description</label>
                        <textarea th:field="*{description}" required maxlength="4000" placeholder="What happened, where, and what you already tried."></textarea>
                        <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
                    </div>
                    <button class="btn btn-primary" type="submit">Submit ticket</button>
                    <a class="btn btn-ghost" th:href="@{/tickets}">Cancel</a>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
