spring:
  datasource:
    url: jdbc:h2:mem:helpdesktest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql

app:
  assignment:
    strategy: category-based
  jwt:
    secret: CampusHelpDeskSecretKeyForHS256TokensMustBe32B!
    expiration-ms: 3600000
  uploads:
    dir: ${java.io.tmpdir}/helpdesk-uploads
    max-file-size-mb: ${MAX_TICKET_ATTACHMENT_MB:5}
